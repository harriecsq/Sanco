# Release builds: push a tag like v1.3.0 and this builds the Windows installer
# (NSIS, same as `npx tauri build`, incl. windows/hooks.nsh) and a universal
# macOS DMG (Apple Silicon + Intel), then attaches both to a draft GitHub
# Release. Check the draft and publish it by hand.
#
# Or run it by hand (Actions → release → Run workflow) with a tag such as
# v1.9.0: it builds the branch it runs on, and the tag is made on that commit
# when the draft is published.
#
# Release notes: `.github/release-notes/<tag>.md`, if it exists, goes above
# the install notes.
#
# Unsigned: Windows shows SmartScreen ("More info" → "Run anyway"); on the Mac,
# right-click Sanco → Open once (or System Settings → Privacy & Security →
# "Open Anyway").
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release, e.g. v1.9.0"
        required: true

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      - id: release
        uses: actions/github-script@v7
        env:
          INPUT_TAG: ${{ inputs.tag }}
        with:
          script: |
            const fs = require("fs");
            const tag = context.eventName === "workflow_dispatch"
              ? process.env.INPUT_TAG.trim()
              : context.ref.replace("refs/tags/", "");
            if (!/^v\d+\.\d+\.\d+$/.test(tag)) throw new Error(`not a version tag: ${tag}`);
            const version = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8")).version;
            if (tag !== `v${version}`) throw new Error(`tag ${tag} doesn't match the app version ${version}`);
            const notesFile = `.github/release-notes/${tag}.md`;
            const notes = fs.existsSync(notesFile) ? fs.readFileSync(notesFile, "utf8").trim() : "";
            const release = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: `Sanco ${tag}`,
              body: [
                ...(notes ? [notes, "", "---", ""] : []),
                "**Windows:** run `Sanco_*_x64-setup.exe`. Installed PCs can also update each other from the app.",
                "",
                "**Mac:** open `Sanco_*_universal.dmg`, drag Sanco to Applications, then right-click Sanco → Open the first time (the app is not signed).",
                "",
                "Every PC must run the same version to sync.",
              ].join("\n"),
              draft: true,
              prerelease: false,
            };
            // A draft for this tag from an earlier run is reused (its
            // installers are replaced), so a second run doesn't make a
            // second draft.
            const all = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const draft = all.find((r) => r.draft && r.tag_name === tag);
            if (draft) {
              await github.rest.repos.updateRelease({ ...release, release_id: draft.id });
              return draft.id;
            }
            if (all.some((r) => !r.draft && r.tag_name === tag)) {
              throw new Error(`${tag} is already published`);
            }
            const { data } = await github.rest.repos.createRelease(release);
            return data.id;

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
            rust_targets: ""
          # Intel Mac: GitHub's Apple Silicon (arm64) Macs are often short
          # (jobs never start). It still builds the universal DMG.
          - platform: macos-15-intel
            args: "--target universal-apple-darwin"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    # env:
    #   CARGO_BUILD_JOBS: 2   # lower this if a runner runs out of memory
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ matrix.platform }}

      - run: npm ci

      # beforeBuildCommand (npm run build) builds, typechecks and lints the frontend.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
