[workspace]
resolver = "3"
members = ["crates/sanco-core", "crates/sanco-net", "src-tauri"]

[workspace.package]
version = "1.3.0"
edition = "2024"
rust-version = "1.90"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tracing = "0.1"

# Password hashing is far too slow unoptimized (seconds per sign-in in debug).
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
