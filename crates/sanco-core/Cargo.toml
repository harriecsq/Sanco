[package]
name = "sanco-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
argon2 = "0.6.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid = { version = "1.28.0", features = ["v4", "v5", "v7", "serde"] }
# Pinned exactly, like in src-tauri.
specta = { version = "=2.0.0-rc.25", features = ["derive"], optional = true }
rust_decimal = { version = "1.43.0", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3.27.0"

[features]
# Derives `specta::Type` on types the Tauri shell sends to the frontend.
specta = ["dep:specta"]
